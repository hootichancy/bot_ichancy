<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0a192f, #1e3a8a);
            color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 20px 0;
        }
        canvas {
            border-radius: 50%;
            box-shadow: 0 0 20px #f59e0b, 0 0 40px #1d4ed8;
        }
        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #f59e0b;
            z-index: 10;
        }
        button {
            background: linear-gradient(90deg, #d97706, #f59e0b);
            color: #000;
            font-weight: bold;
            font-size: 18px;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.3s;
        }
        button:disabled { background: #6b7280; cursor: not-allowed; }
        #result { margin-top: 15px; font-size: 20px; font-weight: bold; color: #10b981; }
    </style>
</head>
<body>
    <h2>🎡 عجلة الحظ 🎡</h2>
    <p>لفاتك المتبقية: <span id="spins-count">0</span></p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="320" height="320"></canvas>
    </div>

    <button id="spin-btn" onclick="spinWheel()">تدوير العجلة</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || 0;

        const prizes = [0, 5, 10, 15, 25, 50, 100, 500, 10000];
        const colors = ['#1e3a8a', '#d97706', '#1e40af', '#b45309', '#1d4ed8', '#f59e0b', '#2563eb', '#d97706', '#3b82f6'];
        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        let startAngle = 0;
        const arc = Math.PI / (prizes.length / 2);
        let isSpinning = false;

        function drawWheel() {
            for (let i = 0; i < prizes.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];
                ctx.beginPath();
                ctx.arc(160, 160, 150, angle, angle + arc, false);
                ctx.arc(160, 160, 0, angle + arc, angle, true);
                ctx.fill();
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px Arial";
                ctx.translate(160 + Math.cos(angle + arc / 2) * 110, 160 + Math.sin(angle + arc / 2) * 110);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(prizes[i].toString(), -ctx.measureText(prizes[i].toString()).width / 2, 0);
                ctx.restore();
            }
        }

        async function fetchUserData() {
            if(!userId) return;
            try {
                const res = await fetch(`/api/user_spins?user_id=${userId}`);
                const data = await res.json();
                document.getElementById('spins-count').innerText = data.spins;
            } catch(e) {}
        }

        async function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('result').innerText = "";

            try {
                const res = await fetch('/api/spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                
                if (!data.success) {
                    alert(data.message);
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;
                    return;
                }

                const prizeIndex = prizes.indexOf(data.prize);
                const degreesPerSlice = 360 / prizes.length;
                const targetDegree = 360 - (prizeIndex * degreesPerSlice) - (degreesPerSlice / 2) + 270;
                const totalRotation = 360 * 5 + targetDegree;

                let currentRotation = 0;
                const duration = 4000;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 3);
                    
                    startAngle = (easeOut * totalRotation * Math.PI / 180);
                    drawWheel();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        isSpinning = false;
                        document.getElementById('spin-btn').disabled = false;
                        document.getElementById('result').innerText = `🎉 مبروك! فزت بـ ${data.prize} نقطة!`;
                        fetchUserData();
                    }
                }
                requestAnimationFrame(animate);
            } catch (e) {
                alert("حدث خطأ في الاتصال");
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
            }
        }

        drawWheel();
        fetchUserData();
    </script>
</body>
</html>
