<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الحظ 🎡</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #001f3f, #000000); /* أزرق داكن و أسود */
            color: #FFD700; /* ذهبي */
            font-family: 'Tajawal', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        h1 {
            text-shadow: 0 0 10px #FFD700;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px 0;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #FFD700;
            background: conic-gradient(
                #003366 0deg 40deg, #00509E 40deg 80deg, 
                #003366 80deg 120deg, #00509E 120deg 160deg,
                #003366 160deg 200deg, #00509E 200deg 240deg,
                #003366 240deg 280deg, #00509E 280deg 320deg,
                #003366 320deg 360deg
            );
            box-shadow: 0 0 20px #FFD700, inset 0 0 20px #000;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1); /* حركة خرافية */
            position: relative;
        }
        /* المؤشر */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 30px solid #FFD700;
            z-index: 10;
        }
        .spin-btn {
            background: linear-gradient(45deg, #FFD700, #DAA520);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        .spin-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>عجلة الحظ الملكية 🎰</h1>
    
    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <!-- التصميم يعتمد على CSS Conic Gradient للتبسيط وزيادة الأداء -->
        </div>
    </div>

    <button class="spin-btn" id="spinBtn">ابدأ الدوران</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');

        document.getElementById('spinBtn').addEventListener('click', async () => {
            if (!userId) return Swal.fire('خطأ', 'لم يتم التعرف على المستخدم', 'error');
            
            document.getElementById('spinBtn').disabled = true;

            // طلب النتيجة من السيرفر قبل الدوران
            try {
                const response = await fetch('/spin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                
                const data = await response.json();
                
                if (data.error) {
                    Swal.fire('عذراً', data.error, 'warning');
                    document.getElementById('spinBtn').disabled = false;
                    return;
                }

                // حركة الدوران العشوائية البصرية
                const wheel = document.getElementById('wheel');
                const extraSpins = 360 * 5; // 5 لفات كاملة
                const randomDegree = Math.floor(Math.random() * 360); 
                const totalDegree = extraSpins + randomDegree;
                
                wheel.style.transform = `rotate(${totalDegree}deg)`;

                // الانتظار حتى تنتهي الحركة (4 ثواني)
                setTimeout(() => {
                    Swal.fire({
                        title: 'مبروووك! 🎉',
                        text: `لقد ربحت ${data.prize}`,
                        icon: 'success',
                        confirmButtonText: 'إغلاق',
                        confirmButtonColor: '#FFD700'
                    }).then(() => {
                        tg.close(); // إغلاق النافذة والعودة للبوت
                    });
                }, 4100);

            } catch (err) {
                Swal.fire('خطأ', 'حدث خطأ في الاتصال بالخادم', 'error');
                document.getElementById('spinBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
